[package]
name = "sppark-msm"
version = "0.1.0"
edition = "2021"

[features]
default = []
gpu = []
bw6_generic = []  # Enable broken generic BW6-761 kernel (hangs due to register pressure)

[dependencies]
ark-bls12-377 = "0.5"
ark-bw6-761 = "0.5"
ark-mnt4-298 = "0.5"
ark-mnt6-298 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-std = "0.5"

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }

# Custom test harness for BW6-761 GPU tests (avoids Rust test framework CUDA cleanup conflicts)
# See tests/test_gpu_cgbn_bw6.rs header for explanation of why custom harness is needed.
[[test]]
name = "test_gpu_cgbn_bw6"
path = "tests/test_gpu_cgbn_bw6.rs"
harness = false

[[test]]
name = "layout_validation_bw6_761"
path = "tests/layout_validation_bw6_761.rs"
harness = false

# CPU vs GPU consistency tests - critical for SP1 e2e validation
[[test]]
name = "test_gpu_cpu_consistency"
path = "tests/test_gpu_cpu_consistency.rs"
harness = false

# MNT4-298 CGBN GPU tests
[[test]]
name = "test_gpu_cgbn_mnt4"
path = "tests/test_gpu_cgbn_mnt4.rs"
harness = false

[[test]]
name = "layout_validation_mnt4_298"
path = "tests/layout_validation_mnt4_298.rs"
harness = false

# MNT6-298 CGBN GPU tests
[[test]]
name = "test_gpu_cgbn_mnt6"
path = "tests/test_gpu_cgbn_mnt6.rs"
harness = false

[[test]]
name = "layout_validation_mnt6_298"
path = "tests/layout_validation_mnt6_298.rs"
harness = false
