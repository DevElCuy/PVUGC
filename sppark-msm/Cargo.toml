[package]
name = "sppark-msm"
version = "0.1.0"
edition = "2021"

[features]
default = []
gpu = []
bw6_generic = []  # Enable broken generic BW6-761 kernel (hangs due to register pressure)

[dependencies]
ark-bls12-377 = "0.5"
ark-bw6-761 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-std = "0.5"

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }

# Custom test harness for CGBN tests (avoids Rust test framework CUDA cleanup conflicts)
[[test]]
name = "test_gpu_cgbn_bw6"
path = "tests/test_gpu_cgbn_bw6.rs"
harness = false
